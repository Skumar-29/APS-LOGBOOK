name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify diary, engine and preserved features on desktop, phone and WebKit
        run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: truck-workspace-build
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truck-workspace-browser-results
          path: test-results
          retention-days: 3
