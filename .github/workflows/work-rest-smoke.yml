name: Work/rest focused verification
on:
  push:
    branches: [fix/work-rest-validation-2026-10-19, fix/diary-book-error-recovery-2026-10-19, fix/chronological-paper-pages-2026-10-19, fix/diary-next-date-navigation-2026-10-19, feat/proactive-rest-and-mobile-fix-2026-10-23]
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/work-rest-validation.spec.ts"
      - ".github/workflows/work-rest-smoke.yml"
permissions:
  contents: read
jobs:
  verify-work-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/work-rest-validation.spec.ts tests/e2e/protected-rest.spec.ts --project=desktop --project=phone --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-rest-smoke-results
          path: test-results
          retention-days: 3
